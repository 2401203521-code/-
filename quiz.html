<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>JLPT N1 60題チャレンジ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}.wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 32px}.quiz{width:min(680px,100%)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-weight:800;font-size:15px}.count{font-size:13px;color:#6b7280}.bar{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;width:0;background:#111827;transition:width .2s}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000a}.section{font-size:11px;color:#6b7280;font-weight:800;letter-spacing:.08em;margin-bottom:9px}.question{font-size:20px;font-weight:800;line-height:1.7;margin:0 0 22px;white-space:pre-wrap}.options{display:grid;gap:12px}.option{width:100%;min-height:58px;border:1.5px solid #d1d5db;background:#fff;border-radius:13px;padding:13px 15px;text-align:left;font-size:16px;line-height:1.45;cursor:pointer;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;transition:.12s}.option:active{transform:scale(.99)}.option:hover{border-color:#6b7280;background:#fafafa}.option.selected{border-color:#111827;background:#f3f4f6;box-shadow:0 0 0 2px #11182712}.letter{width:30px;height:30px;min-width:30px;border-radius:50%;background:#f0f2f5;display:grid;place-items:center;font-size:13px;font-weight:800}.selected .letter{background:#111827;color:#fff}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.hint{font-size:12px;color:#6b7280}.next{border:0;background:#111827;color:#fff;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer;min-width:110px}.next:disabled{opacity:.35;cursor:not-allowed}.result{text-align:center;padding:22px}.score{font-size:42px;font-weight:900;margin:10px 0}.restart{border:0;background:#111827;color:#fff;border-radius:11px;padding:13px 18px;font-weight:800}.back{display:inline-block;margin-top:14px;color:#6b7280;text-decoration:none;font-size:13px}@media(max-width:480px){.wrap{padding:12px 10px 24px}.card{padding:17px 14px;border-radius:16px}.question{font-size:18px;line-height:1.65;margin-bottom:18px}.option{min-height:56px;font-size:15px;padding:12px}.footer{margin-top:14px}.next{width:100%}.footer{display:block}.hint{margin-bottom:9px}}</style></head><body><div class="wrap"><main class="quiz"><div class="top"><div class="brand">🇯🇵 JLPT N1 60題チャレンジ</div><div class="count" id="count"></div></div><div class="bar"><i id="progress"></i></div><section class="card" id="app"></section></main></div><script>
const questions=[{"n":1,"prompt":"1/60「彼の説明はあまりにも＿＿で、要点がつかめない。」","options":["端的","抽象的","迅速","強引"]},{"n":2,"prompt":"2/60「AIを＿＿して、大量の資料を短時間で分析した。」","options":["駆使","携わる","食い止める","垣間見せる"]},{"n":3,"prompt":"3/60「彼は長年、教育研究に＿＿いる。」","options":["駆使して","携わって","端的に","抽象的に"]},{"n":4,"prompt":"4/60「普段は無口な彼が、会議で意外な一面を＿＿。」","options":["垣間見せた","食い止めた","駆使した","携わった"]},{"n":5,"prompt":"5/60「被害の拡大を＿＿ため、早急な対応が必要だ。」","options":["食い止める","垣間見せる","携わる","駆使する"]},{"n":6,"prompt":"6/60「結論だけを＿＿に言えば、計画は延期だ。」","options":["端的","画一的","ぞんざい","かろうじて"]},{"n":7,"prompt":"7/60「その説明は＿＿していて、具体的な根拠がない。」","options":["画一的","抽象的","端的","綿密"]},{"n":8,"prompt":"8/60「客に対して＿＿な態度を取るのは失礼だ。」","options":["ぞんざい","端的","画一的","綿密"]},{"n":9,"prompt":"9/60「彼は＿＿合格ラインに届いた。」","options":["かろうじて","あえて","ことごとく","もっぱら"]},{"n":10,"prompt":"10/60「問題の＿＿には、制度そのものの欠陥がある。」","options":["根底","手配","実費","端的"]},{"n":11,"prompt":"11/60「彼の仕事ぶりは＿＿で、細部までよく確認している。」","options":["綿密","ぞんざい","画一的","強引"]},{"n":12,"prompt":"12/60「必要な機材を事前に＿＿しておいた。」","options":["手配","根底","駆使","実費"]},{"n":13,"prompt":"13/60「交通費は＿＿で支給される。」","options":["実費","根底","画一的","抽象的"]},{"n":14,"prompt":"14/60「彼は失敗を＿＿、新しい方法を試した。」","options":["ものともせず","ことごとく","あくまで","もっぱら"]},{"n":15,"prompt":"15/60「その政策は長期的な影響を＿＿必要がある。」","options":["踏まえる","食い止める","垣間見せる","駆使する"]},{"n":16,"prompt":"16/60「彼は周囲の反対を＿＿、計画を実行した。」","options":["よそに","もとに","かねて","めぐって"]},{"n":17,"prompt":"17/60「彼女は一見冷静だが、内心では不安を＿＿いる。」","options":["抱えて","手配して","駆使して","食い止めて"]},{"n":18,"prompt":"18/60「その問題については、＿＿検討する必要がある。」","options":["慎重に","ぞんざいに","端的に","かろうじて"]},{"n":19,"prompt":"19/60「彼の発言は世論に大きな＿＿を与えた。」","options":["波紋","根底","実費","手配"]},{"n":20,"prompt":"20/60「計画は＿＿に終わり、期待した成果は得られなかった。」","options":["尻すぼみ","綿密","端的","画一的"]},{"n":21,"prompt":"21/60「彼が来る＿＿、会議を始めることにした。」","options":["に先立って","にかかわらず","までに","ものなら"]},{"n":22,"prompt":"22/60「専門家の意見を＿＿、最終案をまとめた。」","options":["踏まえて","ものともせず","よそに","あえて"]},{"n":23,"prompt":"23/60「忙しい＿＿、彼は毎日運動を続けている。」","options":["にもかかわらず","に先立って","にひきかえ","を皮切りに"]},{"n":24,"prompt":"24/60「この問題は専門家＿＿簡単には解決できない。」","options":["であっても","に先立って","をめぐって","にひきかえ"]},{"n":25,"prompt":"25/60「健康＿＿、充実した生活は成り立たない。」","options":["あっての","に先立つ","を余儀なくされる","と相まって"]},{"n":26,"prompt":"26/60「予算不足＿＿、計画を縮小せざるを得ない。」","options":["により","にひきかえ","をものともせず","に先立って"]},{"n":27,"prompt":"27/60「彼は批判を＿＿、自分の方針を貫いた。」","options":["ものともせず","に先立って","を皮切りに","にひきかえ"]},{"n":28,"prompt":"28/60「新制度の導入＿＿、研修を実施する。」","options":["に伴い","にもかかわらず","をよそに","あっての"]},{"n":29,"prompt":"29/60「彼は責任者＿＿、最後まで説明を続けた。」","options":["として","にひきかえ","を皮切りに","ものなら"]},{"n":30,"prompt":"30/60「この作品は若者＿＿人気を集めている。」","options":["を中心に","に先立って","にかかわらず","を余儀なくされる"]},{"n":31,"prompt":"31/60「彼は危険だと知り＿＿、一人で現場に向かった。」","options":["つつも","かねない","に先立って","にほかならない"]},{"n":32,"prompt":"32/60「そんな言い方をすれば、誤解を招き＿＿。」","options":["かねない","つつも","に伴い","にひきかえ"]},{"n":33,"prompt":"33/60「努力の積み重ね＿＿、今の成果がある。」","options":["あってこそ","に先立って","をよそに","にひきかえ"]},{"n":34,"prompt":"34/60「この計画を実現する＿＿、資金の確保が必要だ。」","options":["には","ものなら","にひきかえ","を皮切りに"]},{"n":35,"prompt":"35/60「彼の成功は才能＿＿、努力の結果だ。」","options":["というより","に先立って","に伴い","を中心に"]},{"n":36,"prompt":"36/60「雨が降ろう＿＿、予定どおり開催する。」","options":["と","にもかかわらず","にひきかえ","に先立って"]},{"n":37,"prompt":"37/60「事情を説明した＿＿、理解してもらえなかった。」","options":["にもかかわらず","に伴い","を皮切りに","あってこそ"]},{"n":38,"prompt":"38/60「新しい制度は来月＿＿実施される。」","options":["を皮切りに","から","にひきかえ","かねない"]},{"n":39,"prompt":"39/60「この結果は、彼の努力の成果＿＿。」","options":["にほかならない","に先立って","をよそに","と相まって"]},{"n":40,"prompt":"40/60「経験を重ねる＿＿、判断も速くなった。」","options":["につれて","にひきかえ","ものなら","を皮切りに"]},{"n":41,"prompt":"41/60【読解】便利さを追求すると、私たちは自分で考える機会まで手放してしまうことがある。検索結果がすぐ出ることと、問題を理解したことは同じではない。筆者が最も言いたいことは？","options":["検索は不要である","便利さと理解は同じではない","情報はすべて信用できる","問題は検索だけで解決できる"]},{"n":42,"prompt":"42/60【短文】便利さを追求すると、私たちは自分で考える機会まで手放してしまうことがある。検索結果がすぐ出ることと、問題を理解したことは同じではない。筆者が最も言いたいことは？","options":["検索は不要である","便利さと理解は同じではない","情報はすべて信用できる","問題は検索だけで解決できる"]},{"n":43,"prompt":"43/60【短文】同じ失敗を避けるには、失敗そのものを恐れるより、原因を言葉にして残すことが重要だ。何が重要だと述べているか？","options":["失敗を隠すこと","原因を記録すること","成功だけを記録すること","失敗を繰り返すこと"]},{"n":44,"prompt":"44/60【短文】専門知識は深いほど価値があるが、それを専門外の人に伝えられなければ、社会で共有されにくい。筆者の考えに最も近いものは？","options":["専門家だけが理解すればよい","知識の深さと伝達力の両方が重要だ","専門知識は不要だ","伝達力だけが重要だ"]},{"n":45,"prompt":"45/60【短文】「急いで結論を出すことが、必ずしも効率的とは限らない。」この文の意味は？","options":["早ければ必ず効率的だ","時間をかければ必ず成功する","拙速な判断がかえって手間を増やす場合がある","結論を出してはいけない"]},{"n":46,"prompt":"46/60【短文】「制度を変えれば問題が解決する」と考えるだけでは不十分である。制度を運用する人の行動や現場の条件も考慮しなければならない。筆者が重視するものは？","options":["制度だけ","現場の条件","理論の暗記","制度変更の速さだけ"]},{"n":47,"prompt":"47/60【中篇】ある店では売上を増やすため、商品数を二倍にした。しかし選択肢が増えたことで客が迷い、購入率は下がった。店は商品を減らし、特徴を明確にしたところ購入率が回復した。最も適切な説明は？","options":["選択肢が多ければ必ず売れる","選択肢の多さが購入を妨げる場合がある","商品数と売上には関係がない","客は特徴を気にしない"]},{"n":48,"prompt":"48/60【中篇】大学では授業の出席率を上げるため、出席確認を厳格化した。その結果、出席率は上がったが、授業中に別の作業をする学生も増えた。ここから分かることは？","options":["出席率だけでは学習状況を測れない","出席確認は無意味である","学生は全員真面目になった","授業内容は重要ではない"]},{"n":49,"prompt":"49/60【中篇】新しい技術を導入すると、作業時間は短縮できる。一方で、操作を覚えるまで一時的に負担が増える。導入を評価する際に必要なのは？","options":["初日の負担だけを見る","長期的な効果も含めて判断する","技術は必ず導入する","操作方法を覚えなくてよい"]},{"n":50,"prompt":"50/60【中篇】地域のイベントでは参加者を増やすため無料化を行った。参加者数は増えたが、直前キャンセルも増えた。主催者は少額の参加費を設定し、キャンセル率を下げた。何が示されているか？","options":["無料なら必ず満足度が高い","参加費が参加行動に影響する可能性がある","イベントには需要がない","参加費は人数に影響しない"]},{"n":51,"prompt":"51/60【中篇】企業が会議を短くしたところ、決定は速くなった。しかし複雑な問題については、十分な議論ができないケースも増えた。最も妥当なのは？","options":["会議は長いほどよい","短い会議には利点と限界がある","複雑な問題は議論不要だ","決定速度は重要ではない"]},{"n":52,"prompt":"52/60【長文】ある研究者は「読書量を増やせば思考力も自動的に高まる」という見方に疑問を呈している。重要なのは冊数ではなく、読んだ内容を比較し、自分の経験と結びつけ、疑問を持つことだという。筆者が読書について重視するのは？","options":["冊数だけ","読む速度だけ","内容を比較し考える過程","難しい本だけを選ぶこと"]},{"n":53,"prompt":"53/60【長文】文章では、データを提示するだけでは十分ではなく、その数字が何を意味するのかを説明する必要があると述べている。なぜなら同じ数字でも比較対象や条件によって解釈が変わるからだ。筆者が問題視しているのは？","options":["数字を使うこと","数字だけで結論を出すこと","比較すること","条件を示すこと"]},{"n":54,"prompt":"54/60【長文】地方都市では人口減少への対策として若者向け施設を増やした。しかし利用者は想定ほど増えなかった。調査すると、施設の数よりも交通の不便さや利用時間の制約が問題だった。最も適切な教訓は？","options":["施設を増やせば問題は解決する","表面的な対策だけでなく利用条件を調べる必要がある","若者は施設を利用しない","交通は関係ない"]},{"n":55,"prompt":"55/60【長文】ある会社は社員の自由な働き方を推進した。満足度は上がった一方、部署間の情報共有が減った。そこで定期的な対面ミーティングを設けたところ、自由度を保ちながら共有不足も改善した。何を示す事例か？","options":["自由な働き方は不可能だ","一つの制度だけで全てを解決できるとは限らない","対面会議は必ず必要だ","満足度は重要ではない"]},{"n":56,"prompt":"56/60【長文】AIによる文章作成が普及すると、人間の文章力は不要になるという意見がある。しかし筆者は、AIが生成した文章の目的や妥当性を判断する力こそ重要になると述べる。筆者の主張は？","options":["AIは文章を書けない","AI時代には判断力がより重要になる","人間は文章を書く必要がない","AIの文章は全て正しい"]},{"n":57,"prompt":"57/60【長文】教育では正解を早く出すことが評価されがちだが、答えに至るまでの試行錯誤にも学習上の価値がある。筆者は評価の何を見直すべきだと考えているか？","options":["正解だけを見る方法","授業時間だけ","教科書の量だけ","試験を完全になくすこと"]},{"n":58,"prompt":"58/60【長文】環境対策では、一人一人の努力が重要だが、個人の意識だけに責任を負わせると限界がある。筆者は制度や企業側の仕組みも必要だと考える。最も近い考えは？","options":["個人の努力だけで十分だ","個人と制度の両面から取り組む必要がある","企業には責任がない","環境対策は不要だ"]},{"n":59,"prompt":"59/60【長文】仕事の成果だけを数値化すると、数値に表れにくい支援や調整の仕事が軽視される可能性がある。そのため評価では、数字とともに過程や周囲への貢献も見る必要がある。筆者が求める評価とは？","options":["数字だけによる評価","成果と過程の両方を見る評価","評価をなくすこと","支援業務だけを評価すること"]},{"n":60,"prompt":"60/60【総合】筆者の議論に共通する姿勢として最も近いものは？","options":["一つの指標だけで判断する","表面的な結果だけでなく背景や条件も考える","新しい方法を全て否定する","数字を使わず感覚だけで判断する"]}];
let index=0,selected=null,answers=[];
const app=document.getElementById("app"),count=document.getElementById("count"),progress=document.getElementById("progress");
function render(){const q=questions[index];selected=answers[index]??null;count.textContent=(index+1)+" / "+questions.length;progress.style.width=((index+1)/questions.length*100)+"%";app.innerHTML='<div class="section">'+(index<20?"語彙":index<40?"文法":"読解")+'</div><h1 class="question">'+escapeHtml(q.prompt.replace(/^\d+\/60/,"").trim())+'</h1><div class="options">'+q.options.map((o,i)=>'<button class="option '+(selected===i?"selected":"")+'" onclick="choose('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHtml(o)+'</span></button>').join("")+'</div><div class="footer"><div class="hint">'+(selected===null?"请选择一个选项":"已选择 "+String.fromCharCode(65+selected))+'</div><button class="next" '+(selected===null?"disabled":"")+' onclick="nextQuestion()">'+(index===questions.length-1?"完成":"下一题 →")+'</button></div>'}
function choose(i){selected=i;answers[index]=i;render()}
function nextQuestion(){if(selected===null)return;if(index<questions.length-1){index++;render()}else{showResult()}}
function showResult(){app.innerHTML='<div class="result"><div class="section">JLPT N1 CHALLENGE</div><h1>🎉 60题完成</h1><div class="score">'+answers.filter(x=>x!==undefined).length+' / '+questions.length+'</div><p>答题记录已保留在当前页面。下一步可以接入正确答案、错题本和 Neon 数据库。</p><button class="restart" onclick="index=0;answers=[];render()">重新开始</button><br><a class="back" href="/">← 返回词汇系统</a></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(questions.length===60)render();else app.innerHTML='<div class="result"><h1>题库加载异常</h1><p>当前读取到 '+questions.length+' 题，请检查数据。</p></div>';
</script></body></html>
