<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N1 Vocabulary OS 2.0</title><style>body{margin:0;background:#f4f5f7;color:#16181d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}.title{font-size:30px;font-weight:800}.sub{color:#6b7280;font-size:13px}.search{display:flex;gap:8px;width:min(560px,100%)}input,select{padding:12px;border:1px solid #ddd;border-radius:10px;background:white;font-size:14px}input{flex:1}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;cursor:pointer}.tabs button.on{background:#111827;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.stats b{font-size:24px}.stats span{display:block;color:#6b7280;font-size:12px;margin-top:4px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.word{cursor:pointer}.jp{font-size:21px;font-weight:800}.rd{color:#777;font-size:12px}.cn{margin-top:8px}.tags{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:#f0f1f3;border-radius:999px;padding:4px 7px}.detail{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px}.modal{background:white;border-radius:16px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.x{float:right;border:0;border-radius:50%;padding:7px;cursor:pointer}.line{border-top:1px solid #eee;margin:18px 0;padding-top:14px}.ex{background:#f7f8fa;padding:13px;border-radius:10px;line-height:1.7}.rel{display:flex;gap:7px;flex-wrap:wrap}.rel button{border:1px solid #ddd;background:white;padding:7px 9px;border-radius:8px;cursor:pointer}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.wrap{padding:16px}.title{font-size:25px}}</style><body><div class="wrap"><div class="head"><div><div class="sub">JLPT N1 · SEMANTIC VOCABULARY</div><div class="title">N1 Vocabulary OS 2.0</div><div class="sub">按语义网络学习，而不是孤立背单词。</div></div><div class="search"><input id="q" placeholder="搜索：日语 / 假名 / 中文 / 搭配 / 例句"><select id="cat"><option value="all">全部词群</option></select></div></div><div class="tabs" id="tabs"></div><div class="stats"><div class="card"><b id="n">0</b><span>词汇</span></div><div class="card"><b id="g">0</b><span>词群</span></div><div class="card"><b id="m">0</b><span>已掌握</span></div><div class="card"><b id="p">0%</b><span>掌握率</span></div></div><div class="list" id="list"></div></div><div class="detail" id="detail"><div class="modal"><button class="x" onclick="closeD()">×</button><div id="body"></div></div></div><script>const groups={ignore:'忽视・敷衍',effort:'努力・投入',judge:'观察・判断',change:'变化・发展',worsen:'恶化・僵局',cause:'产生・导致',hide:'隐藏・暴露',support:'支持・维持',law:'政治・法律',resolve:'解决・处理',emotion:'心理・挫折',last:'临时抱佛脚'};const W=[

].map((x,i)=>({id:i,jp:x[0],rd:x[1],cn:x[2],cat:x[3],col:x[4],ex:x[5]}));let learned=JSON.parse(localStorage.getItem('n1learn2')||'[]');const q=document.getElementById('q'),cat=document.getElementById('cat'),list=document.getElementById('list');Object.entries(groups).forEach(([k,v])=>cat.add(new Option(v,k)));Object.entries(groups).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{cat.value=k;render()};document.getElementById('tabs').append(b)});function render(){let s=q.value.trim().toLowerCase(),c=cat.value;let a=W.filter(w=>(c==='all'||w.cat===c)&&(!s||[w.jp,w.rd,w.cn,w.col,w.ex].join('|').toLowerCase().includes(s)));document.getElementById('n').textContent=W.length;document.getElementById('g').textContent=Object.keys(groups).length;document.getElementById('m').textContent=learned.length;document.getElementById('p').textContent=Math.round(learned.length/W.length*100)+'%';list.innerHTML=a.map(w=>`<div class="card word" onclick="openD(${w.id})"><div class="jp">${w.jp}</div><div class="rd">${w.rd}</div><div class="cn">${w.cn}</div><div class="tags"><span class="tag">${groups[w.cat]}</span><span class="tag">${w.col}</span>${learned.includes(w.id)?'<span class="tag">✓ 已掌握</span>':''}</div></div>`).join('')||'<div class="card">没有找到匹配词汇。</div>'}q.oninput=render;cat.onchange=render;function openD(id){let w=W[id],same=W.filter(x=>x.cat===w.cat&&x.id!==id).slice(0,8);document.getElementById('body').innerHTML=`<div class="sub">${groups[w.cat]} · JLPT N1</div><h1>${w.jp}</h1><div class="rd">${w.rd}</div><h3>${w.cn}</h3><div class="line"><b>高频搭配</b><p>${w.col}</p></div><div class="line"><b>例句</b><div class="ex">${w.ex}</div></div><div class="line"><b>同词群</b><div class="rel">${same.map(x=>`<button onclick="openD(${x.id})">${x.jp}</button>`).join('')}</div></div><div class="line"><button onclick="toggle(${id})" style="padding:10px 14px;border:0;border-radius:9px;background:#111827;color:white">${learned.includes(id)?'取消已掌握':'标记已掌握'}</button></div>`;document.getElementById('detail').style.display='flex'}function toggle(id){learned=learned.includes(id)?learned.filter(x=>x!==id):[...learned,id];localStorage.setItem('n1learn2',JSON.stringify(learned));openD(id);render()}function closeD(){document.getElementById('detail').style.display='none'}document.getElementById('detail').onclick=e=>{if(e.target.id==='detail')closeD()};render()</script></body></html>
